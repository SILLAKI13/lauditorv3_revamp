plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// ✅ Control environment from here — change these flags only
def ISPRODUCTION = false
def IS_STAGING = false
def currentFlavor = ISPRODUCTION ? "production" : (IS_STAGING ? "staging" : "dev")

android {
    namespace 'com.digicoffer.lauditor'
    compileSdkVersion 36
    buildToolsVersion "36.0.0"
    buildFeatures {
        buildConfig true
        compose true
    }
    defaultConfig {
        applicationId "com.digicoffer.lauditor"
        minSdk 26
        targetSdk 36
        versionCode 29
        versionName "1.0.7"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
            debugSymbolLevel = 'FULL'
        }
    }

    flavorDimensions "environment"

    productFlavors {
        production {
            dimension "environment"
            applicationId "com.digicoffer.lauditor"
            versionCode 31
            versionName "1.0.7"
            resValue "string", "app_name", "Lex-Z Lawyers"
            buildConfigField "boolean", "IS_PRODUCTION", "true"
            buildConfigField "boolean", "IS_STAGING", "false"
        }
        staging {
            dimension "environment"
            applicationId "com.digicoffer.lauditor.staging"
            versionCode 1
            versionName "1.0.7-staging"
            resValue "string", "app_name", "Dev Lex-Z Lawyer"
            buildConfigField "boolean", "IS_PRODUCTION", "false"
            buildConfigField "boolean", "IS_STAGING", "true"
        }
        dev {
            dimension "environment"
            applicationId "com.digicoffer.lauditor.dev"
            versionCode 1
            versionName "1.0.7-dev"
            resValue "string", "app_name", "Dev Lex-Z Lawyer"
            buildConfigField "boolean", "IS_PRODUCTION", "false"
            buildConfigField "boolean", "IS_STAGING", "false"
        }
    }

    // ✅ Auto-select the build variant based on flags above
    variantFilter { variant ->
        def flavorName = variant.flavors[0].name
        if (flavorName != currentFlavor) {
            variant.ignore = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

ext {
    smackVersion = '4.4.6'
    supportLibVersion = '27.1.0'
}

configurations {
    all*.exclude group: 'xpp3', module: 'xpp3'
}

dependencies {
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    // Firebase BOM
    implementation platform('com.google.firebase:firebase-bom:34.10.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // SwipeRefreshLayout
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'


    // AndroidX & Material
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "androidx.biometric:biometric:1.1.0"

    // Jetpack Compose BOM & Core Libraries
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // PDF & Image
    implementation("io.github.oothp:android-pdf-viewer:3.2.0-beta05")
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation 'com.itextpdf:itext7-core:9.4.0'
    implementation 'com.tuyenmonkey:mkloader:1.4.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.applandeo:material-calendar-view:1.9.2'
    implementation 'com.oguzdev:CircularFloatingActionMenu:1.0.2'

    // Networking & Play Services
    implementation 'com.google.android.gms:play-services-auth:21.5.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'info.guardianproject.netcipher:netcipher:2.1.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation "com.google.android.flexbox:flexbox:3.0.0"
    implementation 'com.facebook.shimmer:shimmer:0.5.0'

    // Smack XMPP
    implementation "org.igniterealtime.smack:smack-tcp:$smackVersion"
    implementation "org.igniterealtime.smack:smack-experimental:$smackVersion"
    implementation "org.igniterealtime.smack:smack-android:$smackVersion"
    implementation "org.igniterealtime.smack:smack-android-extensions:$smackVersion"

    // Testing
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}